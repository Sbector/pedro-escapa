# Netlify: build + headers de caché (CDN gratuita, sin herramientas nuevas)
[build]
  command = "npm run build"
  publish = "dist"

# Assets con hash de Astro: inmutables, caché larga
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes y SVG optimizados
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video: progresivo (206) + caché larga, mantiene audio
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

# HTML: siempre fresco (navegación cliente + View Transitions)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

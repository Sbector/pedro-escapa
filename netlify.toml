# Netlify: build + headers de caché (CDN gratuita, sin herramientas nuevas)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Assets con hash de Astro (incluye todos los .webp): inmutables, caché larga
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG en raíz (favicon, icons, poster del video)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video en raíz: caché larga (el streaming por rangos 206 lo sirve Netlify por defecto)
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: siempre fresco (navegación cliente + View Transitions)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
